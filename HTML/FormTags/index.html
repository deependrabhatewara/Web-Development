<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Forms</title>
</head>
<body>
   <fieldset>
    <legend align = "center">Basic Form</legend>
     <form>
        <label for="fullName"> Full Name : </label>
        <input type="name" name = "yourname" id="fullName" placeholder="Enter your Name">
        <!-- //place holder is used for inner written text -->

        <br />
        <br />

        <label for="email"> Email :</label>
        <input type="email" name="email" id="email" placeholder="Enter your Email">

        <br />
        <br />

        <label for="password"> Password :</label>
        <input type="password" name="password" id="password" placeholder="Your password">

        <br>
        <br>

        <label for="Cfcpassword">Confirm Password :</label>
        <input type="password" name="Cfcpassword" id="Cfcpassword" placeholder="Confirm yout password">

        <br>
        <br>
        <label for="dob">Date of Birth:</label>
        <input type="date"
        name="dob"
        id="dob">

        <br>
        <br>
        <label for="tob">Time of Birth:</label>
        <input type="time"
        name="tob"
        id="tob">

        <br>
        <br>
        <label for="JoiningTime">Joining Time :</label>
        <input type="datetime-local"
        name="JoiningTime"
        id="JoiningTime"
        >

        <br>
        <br>
        <label for="volume">Volume :</label>
        <input 
        type="range"
        name="volume"
        id="volume"
        min="0"
        max="10"
        value="2"
        >

        <br>
        <br>
        <label for="mobile">Mobile Number:</label>
        <input 
        type="number"
        name="mobile"
        id="mobile"
        >
        <br>
        <br>
        <label for="age">Age :</label>
        <input 
        type="number"
        name="age"
        id="age"
        >


        <br>
        <br>
        <label for="resume">Resume :</label>
        <input type="file"
        name="resume"
        id="resume"
        >

        <br>
        <br>
        <label for="address">Address : </label>
        <textarea name="address" id="address"></textarea>



        <br>
        <br>

        <label for="course">Course :</label>
        <select name="course" id="course">
            <option value="">--Select--</option>
            <option value="Btech">Btech</option>
            <option value="MBA">MBA</option>
            <option value="BBA">BBA</option>
            <option value="D-pharma">D-Pharma</option>
            <option value="MBBS">MBBS</option>
        </select>

        <br>
        <br>
        <label for="gender">Gender :</label>
        <!-- If we need one selection at a time is called Radio Button 
         and for multiple Selection we use check box-->
         <input type="radio" name="gender" id="male" value="male">
         <span>Male</span>
         <input type="radio" name="gender" id="Female" value="male">
         <span>Female</span>
         <input type="radio" name="gender" id="Others" value="male">
         <span>Others</span>

        <br>
        <br>
        <label for="skillset">Skill Set :</label>
        <!-- If we need one selection at a time is called Radio Button 
         and for multiple Selection we use check box-->
         <input type="checkbox" name="skillset" id="Java" value="Java">
         <span>JAVA</span>
         <input type="checkbox" name="skillset" id="dsa" value="dsa">
         <span>DSA</span>
         <input type="checkbox" name="skillset" id="Html" value="Html">
         <span>HTML</span>

        <br>
        <br>
        <button >Submit</button>
        <button>Reset</button>

        <img src="./beautiful-flowers-dahlia.webp" alt=""
        width="200px"
        >


    </form>
   </fieldset>
</body>
</html>
