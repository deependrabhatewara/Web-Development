<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset  style="width: 40%; margin: auto; margin-top: 100px;">
        <h1><center>Pizza Order Form</center></h1>
        <form>
            <label for="name">First Name :</label>
            <input type="name"
            name="name"
            id="name">

            <br>
            <br>

            <label for="lastname">Last Name :</label>
            <input type="text"
            name="lastname"
            id="lastname">

            <br>
            <br>

            <label for="email">Email Address :</label>
            <input type="email"
            name="email"
            id="email">

            <br>
            <br>

            <label for="Contactnumber">Contact Number :</label>
            <input type="number"
            name="Contactnumber"
            id="Contactnumber">

            <br>
            <br>

            <label for="date">Preffered Delivery Date:</label>
            <input type="date"
            name="date"
            id="date">

            <br>
            <br>

            <label for="size">Size :
                <br>
            </label>
            <input type="radio" name="size" id="Small" value="small">
            <span>Small</span>
            <input type="radio" name="size" id="Medium" value="small">
            <span>Medium</span>
            <input type="radio" name="size" id="Small" value="small">
            <span>Large</span>


            <br>
            <br>
            <label for="flavor">Flavor :
                <br>
            </label>
            <input type="checkbox" type="flavor" id="hawaiian">
            <span>Hawaiian(php 150.00)</span>
            <select name="Quantity" id="Quantity">
                <option value="">--Select--</option>
                <option value="1">1</option>
            </select>

            <br>

            <input type="checkbox" type="flavor" id="Pepperoni">
            <span>Pepperoni(php 140.00)</span>
            <select name="Quantity" id="Quantity">
                <option value="">--Select--</option>
                <option value="1">1</option>
            </select>

            <br>

            <input type="checkbox" type="flavor" id="Vegetable">
            <span>Vegetable(php 140.00)</span>
            <select name="Quantity" id="Quantity">
                <option value="">--Select--</option>
                <option value="1">1</option>
            </select>

            <br>
            <br>

            <label for="Creditcardnumber">Credit Card Number:</label>
            <input type="number" name="Creditcardnumber" id="Creditcardnumber">

            <br>
            <br>

            <label for="Pin">PIN :</label>
            <input type="password" name="password" id="Pin">

            <br>
            <br>

            <label for="Additionalnote">Additional Note:</label>
            <br>
            <textarea name="address" id="Additionalnote"></textarea>

            <br>

            <br>

            <button>Submit Order</button>

        </form>
    </fieldset>

</html>
